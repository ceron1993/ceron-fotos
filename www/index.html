<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#13242e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cerón Fotos Prediales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de campo, directa, manos sucias y sol fuerte: botones grandes.
   IDEA: la libreta de campo del reconocedor predial — manzana, predio, foto.
   PICTURE: la rejilla de predios de la manzana, cada casilla se llena con su foto.
   COLOUR and TYPE: mapa topográfico — tierra clara, tinta azul noche, café de curvas de nivel, magenta de ruta; Overpass.
   LAYOUT: barra superior fija, una columna, acción principal siempre al alcance del pulgar. */
:root{color-scheme:light dark;
--bg:light-dark(#fbfbf2,#0d1c24);--card:light-dark(#ffffff,#13283350);--ink:light-dark(#13242e,#e8efe9);
--soft:light-dark(#5b6b72,#9fb3ba);--line:light-dark(#dfe0d2,#24404c);--sea:light-dark(#bfe3ee,#173847);
--brown:light-dark(#a8551b,#e08a4c);--mag:#d6127e;--bar:#13242e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Overpass,system-ui,sans-serif;overflow-x:clip;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:#fbfbf2;display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px);min-height:58px}
header b{font-weight:800;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .back{background:none;border:0;color:#fbfbf2;font:inherit;font-size:26px;width:44px;height:44px;border-radius:10px;cursor:pointer}
header .back:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label.btn:focus-within{outline:3px solid var(--mag);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:18px max(4vw,14px)}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05;margin:6px 0 6px;font-weight:800;text-wrap:balance}
.sub{color:var(--soft);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:600 16px Overpass,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.big{width:100%;min-height:76px;font-size:21px;font-weight:800;border-radius:16px}
.btn.warn{border-color:var(--brown);color:var(--brown)}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.row>.btn{flex:1 1 160px}
.zonas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.z{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.z h3{margin:0;font-size:24px;font-weight:800}
.z p{margin:2px 0 10px;color:var(--soft);font-size:14px}
.meter{height:10px;border-radius:6px;background:var(--sea);overflow:hidden}.meter i{display:block;height:100%;background:var(--brown)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.p{position:relative;aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);background:var(--sea) center/cover no-repeat;cursor:pointer;color:var(--ink);font:inherit;padding:0;overflow:hidden}
.p.ok{border:2px solid var(--brown)}
.p span{position:absolute;left:6px;bottom:6px;background:var(--bar);color:#fbfbf2;font-weight:800;font-size:15px;padding:2px 8px;border-radius:8px}
.p em{position:absolute;right:6px;top:6px;background:var(--mag);color:#fff;font-style:normal;font-weight:800;font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px}
.fotos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:16px}
.f{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.f img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sea)}
.f div{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px;font-size:13px;font-weight:600}
.f div span{flex:1;overflow-wrap:anywhere}
.f button{width:40px;height:40px;border:0;background:none;color:var(--brown);font-size:20px;cursor:pointer;border-radius:8px}
label.fld{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;min-height:48px;font:16px Overpass,sans-serif;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:600}.chk input{width:22px;height:22px;accent-color:var(--mag)}
.prev{font-weight:800;font-size:22px;color:var(--brown);margin:10px 0 0;overflow-wrap:anywhere}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom))}
.nav .btn{flex:1}
.empty{border:2px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--soft)}
.ov{position:fixed;inset:0;background:#0d1c24b0;z-index:20;display:grid;place-items:end center;padding:10px}
.dlg{background:var(--bg);color:var(--ink);width:min(520px,100%);border-radius:18px;padding:20px;max-height:92vh;overflow:auto}
.dlg h2{margin:0 0 6px;font-size:24px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--bar);color:#fbfbf2;padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:92vw;text-align:center}
.hint{font-size:13px;color:var(--soft)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
@media(prefers-reduced-motion:no-preference){.p.ok{animation:pop .3s}@keyframes pop{from{transform:scale(.92)}}}
</style>
</head>
<body>
<header><button class="back" id="back" aria-label="Volver" hidden>←</button><b id="ttl">Cerón Fotos Prediales</b></header>
<main id="app"></main>
<div id="nav"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s).replace(/[\/\\:*?"<>|]/g,'-').replace(/\s+/g,' ').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TIPOS={MZ:'Manzana',VDA:'Vereda',SEC:'Sector',X:'Otro (sin prefijo)'};

/* ---------- almacenamiento: IndexedDB con respaldo en memoria ---------- */
let idb=null;const mem={zonas:new Map(),fotos:new Map()};
const openDB=()=>new Promise(res=>{try{const r=indexedDB.open('ceron-fotos',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('zonas',{keyPath:'id'});d.createObjectStore('fotos',{keyPath:'id'}).createIndex('zona','zona')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
const tx=(st,mode,fn)=>new Promise((res,rej)=>{const t=idb.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const put=(st,o)=>idb?tx(st,'readwrite',s=>s.put(o)):(mem[st].set(o.id,o),Promise.resolve());
const del=(st,id)=>idb?tx(st,'readwrite',s=>s.delete(id)):(mem[st].delete(id),Promise.resolve());
const all=st=>idb?tx(st,'readonly',s=>s.getAll()):Promise.resolve([...mem[st].values()]);
const cfg=(()=>{let c={sello:false,gps:true,sub:true};try{Object.assign(c,JSON.parse(localStorage.getItem('cf-cfg')||'{}'))}catch(e){}return c})();
const saveCfg=()=>{try{localStorage.setItem('cf-cfg',JSON.stringify(cfg))}catch(e){}};

let zonas=[],fotos=[],view={v:'home'};const urls=new Map();
const url=f=>{if(!urls.has(f.id))urls.set(f.id,URL.createObjectURL(f.blob));return urls.get(f.id)};
const zona=id=>zonas.find(z=>z.id===id);
const pLabel=(z,n)=>{const p=z.predios.find(x=>x.n===n);return p&&p.cod?p.cod:'P-'+n};
const pNum=(z,p)=>{const m=String(pLabel(z,p.n)).match(/(\d+)\s*$/);return m?+m[1]:p.n};
const ordenar=z=>z.predios.sort((a,b)=>pNum(z,a)-pNum(z,b)||a.n-b.n);
const etiqueta=v=>{v=clean(v).toUpperCase();return /^\d+$/.test(v)?'P-'+v:v};
const existe=(z,lab,salvo)=>z.predios.some(p=>p.n!==salvo&&pLabel(z,p.n).toUpperCase()===lab.toUpperCase());
const nuevoPredio=(z,lab)=>{const n=Math.max(0,...z.predios.map(p=>p.n))+1;const p={n,nota:''};if(lab&&lab!=='P-'+n)p.cod=lab;z.predios.push(p);return p};
const sigNum=z=>Math.max(0,...z.predios.map(p=>pNum(z,p)))+1;
const lista=t=>{const out=[];for(const part of String(t).split(/[,;\s]+/)){const r=part.match(/^(\d+)-(\d+)$/);if(r){let a=+r[1],b=+r[2];if(b<a)[a,b]=[b,a];for(let i=a;i<=b&&out.length<1000;i++)out.push(i)}else if(/^\d+$/.test(part))out.push(+part)}return out};
const fotosDe=(zid,n)=>fotos.filter(f=>f.zona===zid&&(n==null||f.predio===n)).sort((a,b)=>a.seq-b.seq);
/* nombre: una sola foto -> "MZ-3 P-1.jpg"; varias -> "MZ-3 P-1_1.jpg", "MZ-3 P-1_2.jpg" */
const nombres=(z,n)=>{const l=fotosDe(z.id,n);const base=clean(z.nombre+' '+pLabel(z,n));return l.map((f,i)=>({f,name:base+(l.length>1?'_'+(i+1):'')+'.'+(f.ext||'jpg')}))};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};

/* ---------- diálogos propios ---------- */
function dialog(html,onOk){const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true">'+html+'</div>';
 document.body.append(ov);const close=()=>ov.remove();ov.addEventListener('click',e=>{if(e.target===ov||e.target.dataset.x!=null)close()});
 const ok=ov.querySelector('[data-ok]');if(ok)ok.addEventListener('click',async()=>{if(await onOk(ov)!==false)close()});
 const first=ov.querySelector('input,select,button');first&&first.focus();return ov}
const confirmar=(msg,txt,fn)=>dialog('<h2>'+esc(msg)+'</h2><div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>'+esc(txt)+'</button></div>',fn);

function nuevaZona(){
 const ov=dialog(`<h2>Nueva manzana o vereda</h2><p class="hint">Se crea una carpeta con sus predios P-1, P-2…</p>
 <label class="fld" for="nt">Tipo</label><select id="nt">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
 <label class="fld" for="nc">Número o nombre</label><input type="text" id="nc" placeholder="Ej. 3 o El Guamo" autocomplete="off">
 <label class="fld" for="nn">¿Cuántos predios tiene?</label><input type="number" id="nn" min="0" max="999" value="10" inputmode="numeric">
 <label class="fld" for="nl">O escriba sus números (opcional)</label><input type="text" id="nl" placeholder="Ej. 1-3, 9, 12" autocomplete="off" inputmode="numeric">
 <p class="hint">Si los predios no van seguidos, escríbalos aquí. Puede agregar o cambiar números después.</p>
 <div class="prev" id="np">MZ-</div>
 <div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>Crear carpeta</button></div>`,async ov=>{
  const nombre=prev(ov);const n=Math.max(0,Math.min(999,parseInt(ov.querySelector('#nn').value)||0));
  if(!ov.querySelector('#nc').value.trim()){ov.querySelector('#nc').focus();return false}
  if(zonas.some(z=>z.nombre.toUpperCase()===nombre.toUpperCase())){toast('Ya existe la carpeta '+nombre);return false}
  const z={id:uid(),tipo:ov.querySelector('#nt').value,nombre,predios:[],creada:Date.now()};
  const nums=lista(ov.querySelector('#nl').value);if(nums.length){for(const x of [...new Set(nums)].sort((a,b)=>a-b))nuevoPredio(z,'P-'+x)}else for(let i=1;i<=n;i++)nuevoPredio(z,'P-'+i);
  zonas.push(z);await put('zonas',z);go({v:'zona',id:z.id})});
 const prev=ov=>{const t=ov.querySelector('#nt').value,c=clean(ov.querySelector('#nc').value).toUpperCase();const s=t==='X'?c:t+'-'+c;ov.querySelector('#np').textContent=s||'—';return s};
 ov.addEventListener('input',()=>prev(ov));prev(ov)}

/* ---------- foto: sello opcional y GPS ---------- */
const gps=()=>new Promise(res=>{if(!cfg.gps||!navigator.geolocation)return res(null);
 try{navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:6000,maximumAge:30000})}catch(e){res(null)}});
async function sellar(blob,texto){
 try{const bmp=await createImageBitmap(blob,{imageOrientation:'from-image'});const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
  const g=c.getContext('2d');g.drawImage(bmp,0,0);const fs=Math.round(c.width/38),pad=fs*.6,lines=texto.split('\n');const h=lines.length*fs*1.3+pad*2;
  g.fillStyle='rgba(19,36,46,.72)';g.fillRect(0,c.height-h,c.width,h);g.fillStyle='#fbfbf2';g.font=`800 ${fs}px Overpass, sans-serif`;
  lines.forEach((l,i)=>g.fillText(l,pad,c.height-h+pad+fs*(i+1)*1.15));
  return await new Promise(r=>c.toBlob(b=>r(b||blob),'image/jpeg',.9))}catch(e){return blob}}
async function agregar(files,z,n){
 if(!files.length)return;toast('Guardando '+files.length+' foto(s)…');const pos=await gps();
 let seq=Math.max(0,...fotosDe(z.id,n).map(f=>f.seq));
 for(const file of files){let blob=file,ext=/png/.test(file.type)?'png':/heic|heif/.test(file.type)?'heic':'jpg';const fecha=Date.now();
  if(cfg.sello){const d=new Date(fecha).toLocaleString('es-CO');blob=await sellar(file,z.nombre+' '+pLabel(z,n)+'\n'+d+(pos?`\n${pos.lat.toFixed(6)}, ${pos.lon.toFixed(6)}`:''));if(blob!==file)ext='jpg'}
  const f={id:uid(),zona:z.id,predio:n,seq:++seq,blob,ext,fecha,lat:pos?.lat??null,lon:pos?.lon??null};
  try{await put('fotos',f);fotos.push(f)}catch(e){toast('No se pudo guardar: memoria llena');break}}
 render()}

/* ---------- ZIP (sin compresión: las JPG ya vienen comprimidas) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
async function zip(items){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const it of items){const isTxt=typeof it.data==='string';const u=isTxt?enc.encode(it.data):new Uint8Array(await it.data.arrayBuffer());
  const name=enc.encode(it.path),crc=crc32(u),size=u.length,d=new Date(it.date||Date.now());
  const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const h=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20],[6,0x0800],[8,0],[10,tm],[12,dt],[14,crc,4],[18,size,4],[22,size,4],[26,name.length],[28,0]].forEach(([o,v,b])=>b?h.setUint32(o,v,true):h.setUint16(o,v,true));
  parts.push(h.buffer,name,isTxt?u:it.data);
  const c=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20],[6,20],[8,0x0800],[10,0],[12,tm],[14,dt],[16,crc,4],[20,size,4],[24,size,4],[28,name.length],[42,off,4]].forEach(([o,v,b])=>b?c.setUint32(o,v,true):c.setUint16(o,v,true));
  cen.push(c.buffer,name);off+=30+name.length+size}
 const cs=cen.reduce((a,p)=>a+p.byteLength,0),e=new DataView(new ArrayBuffer(22));
 e.setUint32(0,0x06054b50,true);e.setUint16(8,items.length,true);e.setUint16(10,items.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
function itemsZona(z){const out=[],rows=[['Carpeta','Predio','Nota / código predial','Archivo','Fecha','Latitud','Longitud']];const root=clean(z.nombre);
 for(const p of z.predios){const ns=nombres(z,p.n);const dir=cfg.sub?root+'/'+pLabel(z,p.n)+'/':root+'/';
  ns.forEach(({f,name})=>{out.push({path:dir+name,data:f.blob,date:f.fecha});rows.push([z.nombre,pLabel(z,p.n),p.nota,name,new Date(f.fecha).toLocaleString('es-CO'),f.lat??'',f.lon??''])});
  if(!ns.length)rows.push([z.nombre,pLabel(z,p.n),p.nota,'(sin fotos)','','',''])}
 out.push({path:root+'/resumen_'+root+'.csv',data:'﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n')});return out}
const CAP=window.Capacitor,NATIVO=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const plug=n=>(CAP.Plugins&&CAP.Plugins[n])||CAP.registerPlugin(n);
const b64=b=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]||'');fr.onerror=j;fr.readAsDataURL(b)});
async function guardarNativo(blob,filename){
 const FS=plug('Filesystem'),SH=plug('Share'),CH=6291456;let enDocs=false;
 const escribir=async(path,directory)=>{for(let o=0;o<blob.size;o+=CH){const data=await b64(blob.slice(o,o+CH));
  if(o===0)await FS.writeFile({path,data,directory,recursive:true});else await FS.appendFile({path,data,directory})}};
 await escribir('export/'+filename,'CACHE');
 try{await escribir('CeronFotos/'+filename,'DOCUMENTS');enDocs=true}catch(e){}
 if(enDocs)toast('Guardado en Documentos/CeronFotos/'+filename);
 try{const {uri}=await FS.getUri({path:'export/'+filename,directory:'CACHE'});await SH.share({title:filename,dialogTitle:'Enviar o guardar '+filename,files:[uri]})}
 catch(e){if(!enDocs)toast('No se pudo compartir el ZIP')}}
async function guardar(blob,filename){
 if(NATIVO){try{await guardarNativo(blob,filename)}catch(e){toast('Error al guardar: '+(e&&e.message||e))}return}
 let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename,data:blob});toast('Descargado: '+filename)}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar aquí ('+(e.code||'error')+')')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast('Descargado: '+filename)}
async function exportar(lista,filename){const items=lista.flatMap(itemsZona);if(items.length<=lista.length){toast('Todavía no hay fotos');return}
 toast('Armando el ZIP…');await guardar(await zip(items),clean(filename)+'.zip')}

/* ---------- vistas ---------- */
function go(v){view=v;render();scrollTo(0,0)}
$('#back').addEventListener('click',()=>view.v==='predio'?go({v:'zona',id:view.id}):go({v:'home'}));
function render(){const app=$('#app'),nav=$('#nav');nav.innerHTML='';$('#back').hidden=view.v==='home';
 if(view.v==='home')return home(app,nav);const z=zona(view.id);if(!z)return go({v:'home'});
 view.v==='zona'?vZona(app,nav,z):vPredio(app,nav,z,view.n)}

function home(app,nav){$('#ttl').textContent='Cerón Fotos Prediales';
 app.innerHTML=`<h1>Fotos de predios, ya en su carpeta</h1><p class="sub">Cree la manzana o vereda, tome las fotos predio por predio y la app las nombra sola: <b>MZ-3 P-1</b>, <b>MZ-3 P-2</b>…</p>
 ${zonas.length?`<div class="zonas">${zonas.slice().sort((a,b)=>b.creada-a.creada).map(z=>{const tot=z.predios.length,con=z.predios.filter(p=>fotosDe(z.id,p.n).length).length,nf=fotosDe(z.id).length;
  return `<button class="z" data-z="${esc(z.id)}"><h3>${esc(z.nombre)}</h3><p>${esc(TIPOS[z.tipo]||'')} · ${tot} predios · ${nf} fotos · ${con}/${tot} con foto</p><div class="meter"><i style="width:${tot?Math.round(con/tot*100):0}%"></i></div></button>`}).join('')}</div>`
 :`<div class="empty"><p><b>Aún no hay carpetas.</b></p><p>Empiece con “Nueva manzana o vereda”.</p></div>`}
 <h2 style="margin-top:28px">Ajustes</h2>
 <label class="chk"><input type="checkbox" id="cs" ${cfg.sello?'checked':''}> Estampar nombre, fecha y GPS dentro de la foto</label>
 <label class="chk"><input type="checkbox" id="cg" ${cfg.gps?'checked':''}> Guardar coordenadas GPS (van en el resumen CSV)</label>
 <label class="chk"><input type="checkbox" id="cb" ${cfg.sub?'checked':''}> Al exportar, una subcarpeta por predio</label>
 <p class="hint" id="st">${idb?'Las fotos quedan guardadas en este celular, en este navegador. Exporte el ZIP al terminar cada manzana.':'Este navegador no permite guardar: las fotos se pierden al cerrar. Exporte antes de salir.'}</p>
 ${zonas.length?'<div class="row"><button class="btn" id="ea">Exportar todo en un ZIP</button></div>':''}`;
 nav.innerHTML='<div class="nav"><button class="btn pri" id="nz">+ Nueva manzana o vereda</button></div>';
 $('#nz').onclick=nuevaZona;app.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>go({v:'zona',id:b.dataset.z}));
 [['#cs','sello'],['#cg','gps'],['#cb','sub']].forEach(([s,k])=>$(s).onchange=e=>{cfg[k]=e.target.checked;saveCfg()});
 const ea=$('#ea');if(ea)ea.onclick=()=>exportar(zonas,'Fotos_prediales_'+new Date().toISOString().slice(0,10));
 if(navigator.storage?.estimate)navigator.storage.estimate().then(s=>{const el=$('#st');if(el&&idb)el.textContent+=` Espacio usado: ${(s.usage/1048576).toFixed(0)} MB.`}).catch(()=>{})}

function vZona(app,nav,z){$('#ttl').textContent=z.nombre;const con=z.predios.filter(p=>fotosDe(z.id,p.n).length).length;
 app.innerHTML=`<h1>${esc(z.nombre)}</h1><p class="sub">${z.predios.length} predios · ${con} con foto · ${fotosDe(z.id).length} fotos. Toque un predio para fotografiarlo.</p>
 <div class="meter" style="margin-bottom:16px"><i style="width:${z.predios.length?Math.round(con/z.predios.length*100):0}%"></i></div>
 <div class="grid">${z.predios.map(p=>{const l=fotosDe(z.id,p.n);return `<button class="p ${l.length?'ok':''}" data-n="${p.n}" aria-label="${esc(pLabel(z,p.n))}, ${l.length} fotos" ${l.length?`style="background-image:url('${url(l[l.length-1])}')"`:''}><span>${esc(pLabel(z,p.n))}</span>${l.length?`<em>${l.length}</em>`:''}</button>`}).join('')}</div>
 <div class="row"><button class="btn" id="ap">+ Agregar predios</button><button class="btn" id="ex">Exportar ZIP</button><button class="btn warn" id="dz">Eliminar carpeta</button></div>`;
 const sig=z.predios.find(p=>!fotosDe(z.id,p.n).length);
 nav.innerHTML=`<div class="nav"><button class="btn pri" id="go">${sig?'Fotografiar '+esc(pLabel(z,sig.n)):'Todos los predios tienen foto'}</button></div>`;
 $('#go').disabled=!sig;if(sig)$('#go').onclick=()=>go({v:'predio',id:z.id,n:sig.n});
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>go({v:'predio',id:z.id,n:+b.dataset.n}));
 $('#ex').onclick=()=>exportar([z],z.nombre);
 $('#ap').onclick=()=>dialog(`<h2>Agregar predios</h2><label class="fld" for="al">Números de los predios</label><input type="text" id="al" placeholder="Ej. 9, 12, 15-18" autocomplete="off" inputmode="numeric">
 <p class="hint">Use comas y guiones para rangos. Si lo deja vacío, se agregan en orden desde P-${sigNum(z)}.</p>
 <label class="fld" for="ac">Cantidad (si no escribió números)</label><input type="number" id="ac" value="1" min="1" max="500" inputmode="numeric">
 <div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>Agregar</button></div>`,async ov=>{
  let nums=lista(ov.querySelector('#al').value);if(!nums.length){const k=Math.max(1,Math.min(500,parseInt(ov.querySelector('#ac').value)||1)),s0=sigNum(z);nums=Array.from({length:k},(_,i)=>s0+i)}
  let rep=0;for(const x of nums){const lab='P-'+x;if(existe(z,lab))rep++;else nuevoPredio(z,lab)}
  ordenar(z);await put('zonas',z);render();if(rep)toast(rep+' predio(s) ya existían y no se repitieron')});
 $('#dz').onclick=()=>confirmar(`¿Eliminar ${z.nombre} y sus ${fotosDe(z.id).length} fotos? No se puede deshacer.`,'Eliminar',async()=>{
  for(const f of fotosDe(z.id)){await del('fotos',f.id);URL.revokeObjectURL(urls.get(f.id)||'');urls.delete(f.id)}fotos=fotos.filter(f=>f.zona!==z.id);zonas=zonas.filter(x=>x!==z);await del('zonas',z.id);go({v:'home'})})}

function renombrar(z,p){const ov=dialog(`<h2>Cambiar número del predio</h2><p class="hint">Escriba solo el número (ej. 9 → P-9) o el nombre completo. Las fotos de este predio tomarán el nuevo nombre al exportar.</p>
 <label class="fld" for="rv">Número o nombre</label><input type="text" id="rv" value="${esc(pLabel(z,p.n))}" autocomplete="off"><div class="prev" id="rp"></div>
 <div class="row"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>Guardar</button></div>`,async ov=>{
  const lab=etiqueta(ov.querySelector('#rv').value);if(!lab){ov.querySelector('#rv').focus();return false}
  if(existe(z,lab,p.n)){toast('Ya existe '+lab+' en '+z.nombre);return false}
  if(lab==='P-'+p.n)delete p.cod;else p.cod=lab;ordenar(z);await put('zonas',z);render()});
 const upd=()=>{ov.querySelector('#rp').textContent=z.nombre+' '+(etiqueta(ov.querySelector('#rv').value)||'—')};ov.addEventListener('input',upd);upd();ov.querySelector('#rv').select()}

function vPredio(app,nav,z,n){const p=z.predios.find(x=>x.n===n);if(!p)return go({v:'zona',id:z.id});const ns=nombres(z,n);
 $('#ttl').textContent=z.nombre+' · '+pLabel(z,n);
 app.innerHTML=`<h1>${esc(z.nombre)} ${esc(pLabel(z,n))}</h1><button class="btn" id="rn" style="min-height:40px;margin-bottom:8px">✎ Cambiar número del predio</button><p class="sub">${ns.length?ns.length+' foto(s) en este predio.':'Sin fotos todavía.'}</p>
 <label class="btn pri big" for="cam">📷 Tomar foto</label><input type="file" id="cam" accept="image/*" capture="environment">
 <div class="row"><label class="btn" for="gal">Subir desde la galería</label><input type="file" id="gal" accept="image/*" multiple></div>
 <label class="fld" for="nota">Nota o número predial (opcional)</label><input type="text" id="nota" value="${esc(p.nota)}" placeholder="Ej. 18753010000030001000 · casa esquinera">
 <div class="fotos">${ns.map(({f,name})=>`<div class="f"><img src="${url(f)}" alt="${esc(name)}" loading="lazy"><div><span>${esc(name)}</span><button data-d="${esc(f.id)}" aria-label="Borrar ${esc(name)}">✕</button></div></div>`).join('')}</div>`;
 const i=z.predios.indexOf(p),ant=z.predios[i-1],sig=z.predios[i+1];
 nav.innerHTML=`<div class="nav"><button class="btn" id="pa" ${ant?'':'disabled'}>← ${ant?esc(pLabel(z,ant.n)):'—'}</button><button class="btn pri" id="ps">${sig?esc(pLabel(z,sig.n))+' →':'+ Nuevo P-'+sigNum(z)}</button></div>`;
 $('#cam').onchange=e=>agregar([...e.target.files],z,n);$('#gal').onchange=e=>agregar([...e.target.files],z,n);
 $('#nota').onchange=async e=>{p.nota=e.target.value.trim();await put('zonas',z)};
 if(ant)$('#pa').onclick=()=>go({v:'predio',id:z.id,n:ant.n});
 $('#ps').onclick=async()=>{if(!sig){const np=nuevoPredio(z,'P-'+sigNum(z));await put('zonas',z);return go({v:'predio',id:z.id,n:np.n})}go({v:'predio',id:z.id,n:sig.n})};
 $('#rn').onclick=()=>renombrar(z,p);
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>confirmar('¿Borrar esta foto?','Borrar',async()=>{const id=b.dataset.d;await del('fotos',id);fotos=fotos.filter(f=>f.id!==id);URL.revokeObjectURL(urls.get(id)||'');urls.delete(id);render()}))}

if(!NATIVO&&location.protocol==='https:'&&'serviceWorker'in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
(async()=>{idb=await openDB();try{navigator.storage?.persist?.()}catch(e){}
 try{zonas=await all('zonas');fotos=await all('fotos')}catch(e){idb=null}render()})();
}
</script>
</body>
</html>

name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar íconos
        run: |
          pip install pillow
          python3 tools/icons.py

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de cámara y GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n\n    <application#' "$M"
          grep -q "permission.CAMERA" "$M"
          cat "$M"

      - name: Ícono de la app
        run: npx capacitor-assets generate --android || echo "No se generó el ícono; se usa el de Capacitor"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CeronFotos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CeronFotos-apk
          path: CeronFotos.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cerón Fotos v1.0.${{ github.run_number }}
          body: APK de Cerón Fotos Prediales. Descárguelo en el celular e instálelo.
          files: CeronFotos.apk
